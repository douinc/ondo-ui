name: Release npm Package

on:
  push:
    branches: [main]

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish package
    environment:
      name: npm-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build and verify static export
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify CLI package contents
        working-directory: packages/ondo-ui-cli
        run: |
          pack_json="$RUNNER_TEMP/ondo-ui-pack-dry-run.json"
          npm pack --dry-run --json > "$pack_json"
          PACK_JSON="$pack_json" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises"

          const [pack] = JSON.parse(
            await readFile(process.env.PACK_JSON, "utf8")
          )
          const files = pack.files.map((file) => file.path).sort()
          const expected = [
            "README.md",
            "README_KO.md",
            "bin/ondo-docs.mjs",
            "bin/ondo-ui.mjs",
            "bin/registry-menu.mjs",
            "bin/shadcn-process.mjs",
            "package.json",
          ]
          const missing = expected.filter((file) => !files.includes(file))
          const extra = files.filter((file) => !expected.includes(file))

          if (missing.length > 0 || extra.length > 0) {
            throw new Error(`Unexpected package contents. Missing: ${missing.join(", ") || "none"}. Extra: ${extra.join(", ") || "none"}.`)
          }
          NODE

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ github.token }}
          version-script: bun run release:version
          publish-script: bun run release:publish -- --tag latest
          pr-title: Version Packages
          commit-message: Version Packages
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"
